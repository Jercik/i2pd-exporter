---
name: commit-msg

# Validate on pull_request only; a post-merge --last check would choke on the
# immutable, auto-composed squash body whose lines exceed the body-length limit.

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMITLINT_PACKAGE_VERSION: "1.0.3"
      # npm's fetch-timeout defaults to 300s — exactly this job's cap — so one
      # stalled request eats the whole budget in silence and the job is killed
      # before npm's own retry ever fires. Observed as five consecutive 5m00s
      # timeouts across align and cluster while the same install took 6s when
      # it worked. Bounding the request keeps the retries useful and turns the
      # tail from minutes into seconds; the cap below then means what it says.
      npm_config_fetch_timeout: "30000"
      npm_config_fetch_retries: "3"
      npm_config_fetch_retry_mintimeout: "1000"
      npm_config_fetch_retry_maxtimeout: "10000"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Deliberately policy-pinned: this workflow runs only a version-pinned npm package and takes no toolchain input from the PR tree — the template, not node-version-file, supplies the fleet baseline.
          node-version: "26.5.0"

      - name: Cache conventional-commit-msg download
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-conventional-commit-msg-${{ env.COMMITLINT_PACKAGE_VERSION }}

      - name: Validate commit messages with commitlint
        # A squash merge (the default) lands the PR title as main's subject; a
        # rebase merge lands the PR's commits. Validate both so semantic-release
        # never sees an unparseable subject on main.
        shell: bash
        env:
          # Pass the attacker-controllable PR title via env, never inline in run: (script injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Squash: the PR title becomes main's subject.
          printf '%s\n' "$PR_TITLE" \
            | npm exec --yes --package=conventional-commit-msg@${COMMITLINT_PACKAGE_VERSION} -- \
              conventional-commit-msg

          # Rebase: the PR's individual commits land on main.
          npm exec --yes --package=conventional-commit-msg@${COMMITLINT_PACKAGE_VERSION} -- \
            conventional-commit-msg \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"
